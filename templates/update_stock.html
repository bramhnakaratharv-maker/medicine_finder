
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Medicine Stock - MedFind</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        h1 {
            text-align: center;
            color: #176b55;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #176b55;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .message {
            background: #e9f7ef;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #176b55;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Update Medicine Stock</h1>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('update_stock') }}">
            <label>Medicine Name</label>
            <input type="text" name="medicine_name"
                   placeholder="e.g. Paracetamol" required>

            <label>Pharmacy Name</label>
            <input type="text" name="pharmacy_name"
                   placeholder="Enter exact pharmacy name" required>

            <label>New Stock Quantity</label>
            <input type="number" name="stock" min="0"
                   placeholder="e.g. 25" required>

            <button type="submit">Update Stock</button>
        </form>

        <a href="{{ url_for('home') }}">Back to Home</a>
    </div>
</body>
</html>
